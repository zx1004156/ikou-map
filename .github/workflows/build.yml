name: Build events.json

on:
  push:
    paths:
      - 'events.csv'
      - 'build.py'
  workflow_dispatch:        # 手動執行按鈕

permissions:
  contents: write           # 允許 bot 推送 commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build.py
        run: python build.py

      - name: Commit events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Update events.json"
          git push

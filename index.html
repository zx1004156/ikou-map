<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ikou-map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([35.0116, 135.7681], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 讀取 events.json
    fetch('events.json')
      .then(res => res.json())
      .then(events => {
        events.forEach(ev => {
          // 建立彈出視窗內容（用 textContent，避免 XSS）
          const box = document.createElement('div');
          const title = document.createElement('b');
          title.textContent = ev.name;
          const date = document.createElement('div');
          date.textContent = ev.date_start + ' ～ ' + ev.date_end;
          const place = document.createElement('div');
          place.textContent = ev.place;
          box.append(title, date, place);

          // 在座標放標記，點擊顯示內容
          L.marker([ev.lat, ev.lng]).addTo(map).bindPopup(box);
        });
      })
      .catch(err => console.error('讀取失敗：', err));
  </script>
</body>
</html>
